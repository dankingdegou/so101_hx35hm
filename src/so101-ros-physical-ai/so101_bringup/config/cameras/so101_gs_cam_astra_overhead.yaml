/**:
  ros__parameters:
    camera_info_url: "package://so101_bringup/config/cameras/cam_overhead_calib.yaml"
    use_sensor_data_qos: false
    sync_sink: false
    use_gst_timestamps: true
    image_encoding: "rgb8"


/static_camera/cam_overhead:
  ros__parameters:
    frame_id: "cam_overhead"
    camera_name: "cam_overhead"
    camera_info_url: "package://so101_bringup/config/cameras/cam_overhead_calib.yaml"
    # Use the stable v4l-by-id path for the current overhead UVC RGB camera.
    gscam_config: >
      v4l2src device=/dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._USB2.0_HD_UVC_WebCam-video-index0 io-mode=2 do-timestamp=true !
      image/jpeg,width=640,height=480,framerate=30/1 !
      jpegdec ! videoconvert
