follower:
  hx35hm_bridge:
    ros__parameters:
      device: /dev/so101_follower
      command_topic: forward_controller/commands
      publish_joint_states_topic: joint_states
      enable_follow_joint_trajectory: true
      enable_gripper_action: false
      enable_position_readback: true
      position_readback_rate_hz: 3.0
      move_duration: 0.2
      stream_command_duration: 0.06
      stream_command_async_write: true
      stream_write_rate_hz: 45.0
      stream_target_smoothing: true
      stream_continuous_follow: false
      stream_max_velocity_rad_s: 1.8
      command_position_deadband_rad: 0.012
      suspend_readback_after_stream_command_s: 0.0
      trajectory_command_rate_hz: 50.0
      trajectory_min_command_interval_s: 0.02
      trajectory_min_segment_duration_s: 0.02
      trajectory_min_total_duration_s: 0.10
      trajectory_final_settle_s: 0.01
      joint_directions:
      - 1
      - -1
      - -1
      - -1
      - 1
      - 1
      joint_zero_positions:
      - 498.0
      - 499.19
      - 500.0
      - 497.05
      - 500.0
      - 500.0
