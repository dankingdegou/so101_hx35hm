servo:
  device: "/dev/so101_leader"
  pos_min: 0
  pos_max: 1000
  range_deg: 240.0
  default_duration_s: 1.0

# Leader arm-specific assembly/calibration template.
# Start with these defaults, then refine per joint after mechanical alignment.
joints:
  shoulder_pan:
    servo_id: 1
    direction: 1
    zero_pos: 500
  shoulder_lift:
    servo_id: 2
    direction: -1
    zero_pos: 500
  elbow_flex:
    servo_id: 3
    direction: 1
    zero_pos: 500
  wrist_flex:
    servo_id: 4
    direction: -1
    zero_pos: 500
  wrist_roll:
    servo_id: 5
    direction: 1
    zero_pos: 500
  gripper:
    servo_id: 6
    direction: 1
    zero_pos: 500

gripper:
  neutral_pos: 500
  open_rad: 1.5
  closed_rad: -0.16
